name: BrandPR Continuous Integration

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend-test:
    name: Backend Pytest & Schema Migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: brandpr
          POSTGRES_PASSWORD: brandpr_dev_password
          POSTGRES_DB: brandpr_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: Verify database migrations
        env:
          APP_ENV: test
          DATABASE_URL: postgresql+psycopg://brandpr:brandpr_dev_password@localhost:5432/brandpr_test
        run: |
          cd backend
          alembic upgrade head

      - name: Run backend test suite
        env:
          APP_ENV: test
          TEST_DATABASE_URL: postgresql+psycopg://brandpr:brandpr_dev_password@localhost:5432/brandpr_test
          DATABASE_URL: postgresql+psycopg://brandpr:brandpr_dev_password@localhost:5432/brandpr_test
          GCS_BUCKET: ""
        run: |
          cd backend
          pytest -v

  frontend-check:
    name: Frontend Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: TypeScript typecheck
        run: |
          cd frontend
          npm run typecheck

      - name: Build Next.js production bundle
        env:
          NEXT_PUBLIC_API_BASE_URL: /api
        run: |
          cd frontend
          npm run build

  docker-compose-validate:
    name: Docker Compose Config Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose specification
        run: |
          docker compose config --quiet
